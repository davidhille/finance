<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haushaltsbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1f1e;--muted:#6b706d;--line:#e4e2dc;
  --accent:#1f6f5c;--accent-soft:#e3f0ec;--neg:#b03a2e;--pos:#1f6f5c;--warn:#a86b00;--warn-soft:#fbf1dc;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141615;--panel:#1c1f1e;--ink:#e8e9e7;--muted:#9aa09c;--line:#2c302e;
  --accent:#5bbf9f;--accent-soft:#1e3330;--neg:#ec7d70;--pos:#5bbf9f;--warn:#e3b04b;--warn-soft:#3a3020;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
.num,td.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--pos)}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:600}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:6px;color:var(--muted);font:inherit;cursor:pointer}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;margin-left:4px}
header .spacer{flex:1}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px}
button.btn,label.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.icon{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:14px}
button.icon:hover{color:var(--ink)}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
tr.sub td:first-child{padding-left:26px;color:var(--muted)}
tr.cat td{font-weight:600}
tr.total td{font-weight:600;border-top:2px solid var(--ink)}
tr.clickable{cursor:pointer}
td input.payee{width:100%;min-width:140px;border-color:transparent;background:transparent}
td input.payee:hover,td input.payee:focus{border-color:var(--line);background:var(--panel)}
td select{max-width:220px}
.purpose{color:var(--muted);font-size:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.state.auto{background:var(--accent-soft);color:var(--accent)}
.state.vorschlag{background:var(--warn-soft);color:var(--warn)}
.state.offen{background:var(--warn);color:#fff}
.muted{color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:36px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px}
.stats div b{display:block;font-size:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.login{max-width:340px;margin:12vh auto}
.login input{width:100%;margin-bottom:8px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.catgrid .card{margin:0}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;margin:3px 3px 0 0;font-size:13px}
.kind{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
dialog input,dialog select{width:100%}
dialog .row{display:flex;gap:8px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
</style>
</head>
<body>
<div id="login" class="login card hidden">
  <h2>Anmelden</h2>
  <input id="email" type="email" placeholder="E-Mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password">
  <button class="btn" id="loginBtn">Anmelden</button>
  <p class="muted" id="loginMsg"></p>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Haushaltsbuch</h1>
    <nav>
      <button data-view="import">Import</button>
      <button data-view="tx">Buchungen <span id="openBadge" class="badge hidden"></span></button>
      <button data-view="year">Jahr</button>
      <button data-view="compare">Jahresvergleich</button>
      <button data-view="cats">Kategorien &amp; Regeln</button>
    </nav>
    <span class="spacer"></span>
    <select id="accSel" aria-label="Konto"></select>
    <button class="ghost" id="logout">Abmelden</button>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<dialog id="newDlg">
  <form id="newForm">
    <h2>Neu anlegen &amp; zuordnen</h2>
    <p class="muted" id="ndTx" style="margin:0"></p>
    <label for="ndCat">Kategorie</label>
    <select id="ndCat"></select>
    <div id="ndNewBox" class="row">
      <div style="flex:2"><label for="ndCatName">Name der neuen Kategorie</label><input id="ndCatName" placeholder="z. B. Haus &amp; Garten"></div>
      <div style="flex:1"><label for="ndKind">Typ</label><select id="ndKind"><option value="ausgabe">Ausgabe</option><option value="einnahme">Einnahme</option><option value="umbuchung">Umbuchung</option></select></div>
    </div>
    <label for="ndSub">Unterkategorie</label>
    <input id="ndSub" placeholder="z. B. Bauhaus – leer = Sonstiges">
    <div class="actions">
      <button type="button" class="ghost" id="ndCancel">Abbrechen</button>
      <button type="submit" class="btn">Anlegen &amp; zuordnen</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
